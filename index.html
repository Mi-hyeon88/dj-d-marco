<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D.MARCO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home">

        <header class="topo">
            <div class="logo">D.MARCO</div>
        </header>

        <section class="boas-vindas">

            <h1>환영합니다</h1>

            <div class="navegacao">

                <button class="card">
                    <div class="icone">⌂</div>
                    <h2>홈</h2>
                    <p>
                        Conheça o projeto,<br>
                        o propósito e<br>
                        quem idealizou este espaço.
                    </p>
                </button>

                <button class="card">
                    <div class="icone">◯</div>
                    <h2>메시지</h2>
                    <p>
                        Leia mensagens,<br>
                        homenagens e<br>
                        palavras deixadas para você.
                    </p>
                </button>

                <button class="card">
                    <div class="icone">♫</div>
                    <h2>추억</h2>
                    <p>
                        Músicas, fotografias<br>
                        e momentos<br>
                        que queremos guardar.
                    </p>
                </button>

            </div>

            <div class="idioma">
                <span>언어 / LANGUAGE</span>

                <div class="idiomas">
                   <button data-language="ko" class="ativo">KR</button>
<button data-language="pt">PT</button>
<button data-language="en">EN</button>
                </div>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
