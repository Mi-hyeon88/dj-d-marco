<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D.MARCO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home">

        <!-- =========================
             TOPO
        ========================== -->

        <header class="topo">

            <div class="logo">D.MARCO</div>

            <div class="topo-direita">

                <div class="seletor-topo">
                    <span class="globo">◎</span>
                    <span>PT</span>
                    <span class="seta">⌄</span>
                </div>

                <div class="menu-mobile" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>

        </header>


        <!-- =========================
             CONTEÚDO PRINCIPAL
        ========================== -->

        <section class="boas-vindas">

            <h1>환영합니다</h1>


            <!-- =========================
                 NAVEGAÇÃO
            ========================== -->

            <div class="navegacao">

                <button class="card">

                    <div class="icone">⌂</div>

                    <h2>홈</h2>

                    <p>
    Tudo começa aqui. O propósito deste espaço.
                    </p>

                </button>


                <button class="card">

                    <div class="icone">◯</div>

                    <h2>메시지</h2>

                    <p>
    O que os fãs querem te dizer.
                    </p>

                </button>


                <button class="card">

                    <div class="icone">♫</div>

                    <h2>추억</h2>

                    <p>
    O que queremos relembrar: momentos, fotos, vídeos e músicas que nos fazem lembrar de você.
                    </p>

                </button>

            </div>


            <!-- =========================
                 IDIOMA
            ========================== -->

            <div class="idioma">

                <span>언어 / LANGUAGE</span>

                <div class="idiomas">

                    <button data-language="ko" class="ativo">
                        KR
                    </button>

                    <button data-language="pt">
                        PT
                    </button>

                    <button data-language="en">
                        EN
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
