<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>D.MARCO — Mensagens</title>

    <link
        rel="stylesheet"
        href="mensagem.css"
    >

</head>


<body>

<main class="mensagens-page">


    <!-- =====================================================
         TOPO
    ====================================================== -->

    <header class="mensagens-topo">

        <a
            href="index.html"
            class="mensagens-voltar"
            aria-label="Voltar"
        >
            ←
        </a>


        <div class="mensagens-titulo">

            <span data-i18n="tituloMural">MURAL</span>

            <i></i>

            <small data-i18n="subtitulo">
                Mensagens ao redor do mundo
            </small>
            
            
        </div>


        <button
            class="mensagens-musica"
            type="button"
            aria-label="Música"
        >
            ♫
        </button>

    </header>



    <!-- =====================================================
         MURAL / GLOBO
    ====================================================== -->

    <section
        class="estado estado-mural ativo"
        data-estado="mural"
    >

        <div
            id="globo"
            class="globo"
            aria-label="Globo interativo"
        ></div>
        
<p
        class="globo-instrucao"
        data-i18n="instrucaoGlobo"
    >
        Mova o globo para explorar os países.<br>
        Toque nas luzes para ver as mensagens.
    </p>

        
    </section>



    <!-- =====================================================
         LISTA DE PAÍSES
    ====================================================== -->

    <section
        class="estado estado-paises"
        data-estado="paises"
    >

        <div class="lista-cabecalho">

            <h1>MURAL</h1>

            <i>✦</i>

            <p data-i18n="subtitulo">
                Mensagens ao redor do mundo
            </p>

        </div>


        <div
            id="listaPaises"
            class="lista-paises"
        ></div>


        <p
            class="lista-instrucao"
            data-i18n="instrucaoPais"
        >
            Toque em um país para ver<br>
            as mensagens ♡
        </p>

    </section>



    <!-- =====================================================
         APRESENTAÇÃO DO PAÍS
    ====================================================== -->

   <section
    class="estado estado-pais"
    data-estado="pais"
>

    <button
        class="estado-voltar"
        data-voltar="mural"
        aria-label="Voltar ao globo"
    >
        ←
    </button>


    <article class="mensagens-carta">

        <header class="mensagens-carta-cabecalho">

            <h1 id="paisNome">
                BRASIL
            </h1>

            <div class="mensagens-carta-divisor">
                <span>✦</span>
            </div>

            <p data-i18n="listaMensagensTitulo">
                Mensagens para você
            </p>

        </header>


        <div
            id="listaMensagens"
            class="lista-mensagens"
        ></div>

    </article>

</section>


    <!-- =====================================================
         CARTA / MENSAGEM
    ====================================================== -->

        <section
    class="estado estado-mensagem"
    data-estado="mensagem"
>

    <button
        class="estado-voltar"
        data-voltar="pais"
        aria-label="Voltar às mensagens"
    >
        ←
    </button>

    <!-- =====================================================
         CENA DA FADA
    ====================================================== -->

    <div
        class="fada-cena"
        id="fadaCena"
        aria-hidden="true"
    >

        <div
            class="fada-voo"
            id="fadaVoo"
        >

            <img
                src="Flying-Fairy-Silhouette.svg"
                class="fada-personagem"
                alt=""
            >

            <div
                class="fada-rastro"
                id="fadaRastro"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         CARTA
    ====================================================== -->

    <article
        class="mensagem-carta-final"
        id="mensagemCarta"
    >

        <header class="carta-cabecalho">

            <div
                class="carta-pais"
                id="cartaPais"
            ></div>

            <div
                class="carta-nome"
                id="cartaNome"
            ></div>

            <div class="carta-divisor">
                <span>✦</span>
            </div>

        </header>


        <div
            class="carta-texto"
            id="cartaTexto"
        ></div>


        <div
            class="carta-final"
            aria-hidden="true"
        >
            ✦
        </div>


        <div
            class="mensagem-controles"
        >

            <button
                type="button"
                id="mensagemAnterior"
            >
                ←
            </button>

            <span></span>

            <button
                type="button"
                id="mensagemProxima"
            >
                →
            </button>

        </div>

    </article>

</section>

 

    <!-- =====================================================
         CARREGAMENTO
    ====================================================== -->

    <div
        id="carregando"
        class="carregando"
    >
        <span>✦</span>
    </div>


    <!-- =====================================================
         ERRO
    ====================================================== -->

    <div
        id="erro"
        class="erro"
        hidden
    >

        <p data-i18n="erro">
            Não foi possível carregar as mensagens.
        </p>

        <button
            id="tentarNovamente"
            type="button"
            data-i18n="tentarNovamente"
        >
            Tentar novamente
        </button>

    </div>


</main>


<!-- =========================================================
     GLOBE.GL
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>


<!-- =========================================================
     JAVASCRIPT DO MURAL
========================================================= -->

<script src="mensagem.js"></script>


</body>
</html>
