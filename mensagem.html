<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>D.MARCO — Mensagens</title>

    <link
        rel="stylesheet"
        href="mensagem.css"
    >

</head>


<body>

<main class="mensagens-page">


    <!-- =====================================================
         TOPO
    ====================================================== -->

    <header class="mensagens-topo">

        <a
            href="index.html"
            class="mensagens-voltar"
            aria-label="Voltar"
        >
            ←
        </a>


        <div class="mensagens-titulo">

            <span data-i18n="tituloMural">MURAL</span>

            <i></i>

            <small data-i18n="subtitulo">
                Mensagens ao redor do mundo
            </small>
            
            
        </div>


        <button
            class="mensagens-musica"
            type="button"
            aria-label="Música"
        >
            ♫
        </button>

    </header>



    <!-- =====================================================
         MURAL / GLOBO
    ====================================================== -->

    <section
        class="estado estado-mural ativo"
        data-estado="mural"
    >

        <div
            id="globo"
            class="globo"
            aria-label="Globo interativo"
        ></div>
        
<p
        class="globo-instrucao"
        data-i18n="instrucaoGlobo"
    >
        Mova o globo para explorar os países.<br>
        Toque nas luzes para ver as mensagens.
    </p>

        
    </section>



    <!-- =====================================================
         LISTA DE PAÍSES
    ====================================================== -->

    <section
        class="estado estado-paises"
        data-estado="paises"
    >

        <div class="lista-cabecalho">

            <h1>MURAL</h1>

            <i>✦</i>

            <p data-i18n="subtitulo">
                Mensagens ao redor do mundo
            </p>

        </div>


        <div
            id="listaPaises"
            class="lista-paises"
        ></div>


        <p
            class="lista-instrucao"
            data-i18n="instrucaoPais"
        >
            Toque em um país para ver<br>
            as mensagens ♡
        </p>

    </section>



    <!-- =====================================================
         APRESENTAÇÃO DO PAÍS
    ====================================================== -->

   <section
    class="estado estado-pais"
    data-estado="pais"
>

    <button
        class="estado-voltar"
        data-voltar="mural"
        aria-label="Voltar ao globo"
    >
        ←
    </button>


    <article class="mensagens-carta">

        <header class="mensagens-carta-cabecalho">

            <h1 id="paisNome">
                BRASIL
            </h1>

            <div class="mensagens-carta-divisor">
                <span>✦</span>
            </div>

            <p data-i18n="listaMensagensTitulo">
                Mensagens para você
            </p>

        </header>


        <div
            id="listaMensagens"
            class="lista-mensagens"
        ></div>

    </article>

</section>


    <!-- =====================================================
         CARTA / MENSAGEM
    ====================================================== -->

    <section
        class="estado estado-mensagem"
        data-estado="mensagem"
    >

  <div
    class="fada-carregando"
    aria-hidden="true"
>
    <div class="rastro-fada"></div>

    <div class="fada">

    <svg
    class="fada-silhueta"
    viewBox="0 0 220 180"
    aria-hidden="true"
>

    <!-- =================================================
         ASAS
    ================================================== -->

    <g class="fada-asas">

        <g class="fada-asa-grupo fada-asa-esquerda">

            <path
                class="fada-asa"
                d="
                    M91 72
                    C67 48 39 29 16 32
                    C36 40 47 52 49 65
                    C51 76 64 81 77 76
                    C84 73 89 68 94 62
                    Z
                "
            />

            <path
                class="fada-asa"
                d="
                    M88 69
                    C65 38 43 17 23 16
                    C38 29 44 42 42 53
                    C40 64 51 70 64 68
                    C74 67 82 63 91 57
                    Z
                "
            />

        </g>


        <g class="fada-asa-grupo fada-asa-direita">

            <path
                class="fada-asa"
                d="
                    M108 70
                    C133 47 161 29 184 32
                    C164 40 153 52 151 65
                    C149 76 136 81 123 76
                    C116 73 111 68 106 62
                    Z
                "
            />

            <path
                class="fada-asa"
                d="
                    M111 67
                    C135 37 157 17 177 16
                    C162 29 156 42 158 53
                    C160 64 149 70 136 68
                    C126 67 118 62 109 56
                    Z
                "
            />

        </g>

    </g>


    <!-- =================================================
         CABELO / COQUE
    ================================================== -->

    <g class="fada-cabeca-grupo">

        <circle
            class="fada-cabelo"
            cx="111"
            cy="29"
            r="7"
        />

        <path
            class="fada-cabelo"
            d="
                M101 39
                C96 42 94 48 97 53
                C99 58 96 64 90 69
                C99 67 106 61 109 54
                C113 61 120 65 128 65
                C121 59 120 53 123 47
                C126 40 118 34 111 34
                C107 34 104 36 101 39
                Z
            "
        />

        <!-- rosto de perfil -->

        <path
            class="fada-rosto"
            d="
                M112 36
                C120 37 126 42 127 48
                C128 53 125 57 120 59
                C116 61 112 58 110 54
                Z
            "
        />

    </g>


    <!-- =================================================
         CORPO / VESTIDO
    ================================================== -->

    <g class="fada-corpo-grupo">

        <path
            class="fada-corpo"
            d="
                M105 54
                C99 63 99 76 104 86

                C108 94 104 103 97 111

                C91 119 81 125 68 130

                C81 130 96 126 105 117

                C112 127 124 132 139 133

                C129 124 121 115 117 105

                C114 96 116 87 120 78

                C124 67 118 57 112 53
                Z
            "
        />


        <!-- tecido esvoaçando -->

        <path
            class="fada-vestido"
            d="
                M105 94
                C94 104 82 110 67 113
                C56 115 48 119 39 126

                C55 124 67 121 78 116

                C66 124 58 131 52 139

                C70 132 85 126 98 119
                Z
            "
        />

    </g>


    <!-- =================================================
         BRAÇO LIVRE
    ================================================== -->

    <path
        class="fada-braco fada-braco-livre"
        d="
            M103 65
            C94 70 87 76 80 84
        "
    />

    <circle
        class="fada-mao"
        cx="79"
        cy="85"
        r="2.4"
    />


    <!-- =================================================
         BRAÇO QUE SEGURA O PERGAMINHO
    ================================================== -->

    <path
        class="fada-braco fada-braco-pergaminho"
        d="
            M116 65
            C126 70 136 70 146 64
            C152 60 157 55 163 50
        "
    />

    <circle
        class="fada-mao"
        cx="164"
        cy="49"
        r="2.5"
    />


    <!-- =================================================
         PERNAS
    ================================================== -->

    <path
        class="fada-perna fada-perna-traseira"
        d="
            M104 100
            C96 110 86 119 74 126
            C66 131 58 134 50 135
        "
    />

    <path
        class="fada-perna fada-perna-dianteira"
        d="
            M113 101
            C122 111 133 118 146 122
            C153 124 160 124 167 122
        "
    />

</svg>
        
        <div class="fada-pergaminho">
            <span></span>
        </div>

    </div>

    <div class="po-fada"></div>
</div>
        
        <button
            class="estado-voltar"
            data-voltar="pais"
            aria-label="Voltar"
        >
            ←
        </button>


        <article class="carta">

            <header class="carta-cabecalho">

                <div
                    id="cartaPais"
                    class="carta-pais"
                >
                    BRASIL
                </div>

                <div
                    id="cartaNome"
                    class="carta-nome"
                >
                    —
                </div>

            </header>


            <div class="carta-divisor">
                <span>✦</span>
            </div>


            <div
                id="cartaTexto"
                class="carta-texto"
            ></div>


            <div class="carta-final">
                ♡
            </div>

        </article>


        <nav class="mensagem-controles">

            <button
                id="mensagemAnterior"
                type="button"
                data-i18n="anterior"
            >
                Anterior
            </button>


            <span id="mensagemContador">
                1 de 1
            </span>


            <button
                id="mensagemProxima"
                type="button"
                data-i18n="proxima"
            >
                Próxima
            </button>

        </nav>

    </section>



    <!-- =====================================================
         CARREGAMENTO
    ====================================================== -->

    <div
        id="carregando"
        class="carregando"
    >
        <span>✦</span>
    </div>


    <!-- =====================================================
         ERRO
    ====================================================== -->

    <div
        id="erro"
        class="erro"
        hidden
    >

        <p data-i18n="erro">
            Não foi possível carregar as mensagens.
        </p>

        <button
            id="tentarNovamente"
            type="button"
            data-i18n="tentarNovamente"
        >
            Tentar novamente
        </button>

    </div>


</main>


<!-- =========================================================
     GLOBE.GL
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>


<!-- =========================================================
     JAVASCRIPT DO MURAL
========================================================= -->

<script src="mensagem.js"></script>


</body>
</html>
