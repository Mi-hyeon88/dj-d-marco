<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>D.MARCO — Mensagens</title>

    <link
        rel="stylesheet"
        href="mensagem.css"
    >

</head>


<body>

<main class="mensagens-page">


    <!-- =====================================================
         TOPO
    ====================================================== -->

    <header class="mensagens-topo">

        <a
            href="index.html"
            class="mensagens-voltar"
            aria-label="Voltar"
        >
            ←
        </a>


        <div class="mensagens-titulo">

            <span data-i18n="tituloMural">MURAL</span>

            <i></i>

            <small data-i18n="subtitulo">
                Mensagens ao redor do mundo
            </small>
            
            
        </div>


        <button
            class="mensagens-musica"
            type="button"
            aria-label="Música"
        >
            ♫
        </button>

    </header>



    <!-- =====================================================
         MURAL / GLOBO
    ====================================================== -->

    <section
        class="estado estado-mural ativo"
        data-estado="mural"
    >

        <div
            id="globo"
            class="globo"
            aria-label="Globo interativo"
        ></div>
        
<p
        class="globo-instrucao"
        data-i18n="instrucaoGlobo"
    >
        Mova o globo para explorar os países.<br>
        Toque nas luzes para ver as mensagens.
    </p>

        
    </section>



    <!-- =====================================================
         LISTA DE PAÍSES
    ====================================================== -->

    <section
        class="estado estado-paises"
        data-estado="paises"
    >

        <div class="lista-cabecalho">

            <h1>MURAL</h1>

            <i>✦</i>

            <p data-i18n="subtitulo">
                Mensagens ao redor do mundo
            </p>

        </div>


        <div
            id="listaPaises"
            class="lista-paises"
        ></div>


        <p
            class="lista-instrucao"
            data-i18n="instrucaoPais"
        >
            Toque em um país para ver<br>
            as mensagens ♡
        </p>

    </section>



    <!-- =====================================================
         APRESENTAÇÃO DO PAÍS
    ====================================================== -->

   <section
    class="estado estado-pais"
    data-estado="pais"
>

    <button
        class="estado-voltar"
        data-voltar="mural"
        aria-label="Voltar ao globo"
    >
        ←
    </button>


    <article class="mensagens-carta">

        <header class="mensagens-carta-cabecalho">

            <h1 id="paisNome">
                BRASIL
            </h1>

            <div class="mensagens-carta-divisor">
                <span>✦</span>
            </div>

            <p data-i18n="listaMensagensTitulo">
                Mensagens para você
            </p>

        </header>


        <div
            id="listaMensagens"
            class="lista-mensagens"
        ></div>

    </article>

</section>


    <!-- =====================================================
         CARTA / MENSAGEM
    ====================================================== -->

    <section
        class="estado estado-mensagem"
        data-estado="mensagem"
    >

  <div
    class="fada-carregando"
    aria-hidden="true"
>
    <div class="rastro-fada"></div>

    <div class="fada">

     <svg
    class="fada-silhueta"
    viewBox="0 0 180 160"
    aria-hidden="true"
>

    <!-- =================================================
         ASAS
    ================================================== -->

    <g class="asas">

        <path
            class="asa asa-esquerda"
            d="
                M76 58
                C61 36, 39 18, 16 22
                C35 31, 43 43, 39 55
                C35 66, 48 72, 62 68
                C68 66, 73 62, 76 58
                Z
            "
        />

        <path
            class="asa asa-direita"
            d="
                M87 55
                C105 30, 132 13, 158 20
                C140 28, 132 40, 138 51
                C144 63, 132 72, 116 69
                C103 67, 94 61, 87 55
                Z
            "
        />

    </g>


    <!-- =================================================
         CABELO
    ================================================== -->

    <path
        class="cabelo"
        d="
            M72 34
            C64 38, 61 47, 64 55
            C66 61, 62 68, 54 74
            C64 72, 73 66, 78 58
            C82 65, 91 70, 101 71
            C93 64, 91 57, 94 50
            C97 42, 89 34, 80 32
            Z
        "
    />


    <!-- =================================================
         CABEÇA
    ================================================== -->

    <circle
        class="cabeca"
        cx="80"
        cy="40"
        r="8"
    />


    <!-- =================================================
         CORPO
    ================================================== -->

    <path
        class="corpo"
        d="
            M75 49
            C69 57, 69 68, 73 78
            C76 86, 73 94, 68 102
            C63 111, 55 119, 46 125

            C58 122, 69 116, 77 106

            C82 116, 91 123, 103 126
            C94 117, 88 108, 85 99
            C82 91, 84 84, 88 76

            C93 65, 89 55, 84 49
            Z
        "
    />


    <!-- =================================================
         BRAÇO TRASEIRO
    ================================================== -->

    <path
        class="braco braco-traseiro"
        d="
            M73 58
            C65 64, 59 72, 55 80
        "
    />


    <!-- =================================================
         BRAÇO QUE SEGURA O PERGAMINHO
    ================================================== -->

    <path
        class="braco braco-pergaminho"
        d="
            M85 57
            C94 63, 103 63, 112 57
            C117 54, 121 50, 126 47
        "
    />

    <circle
        class="mao"
        cx="127"
        cy="46"
        r="2.5"
    />


    <!-- =================================================
         PERNA TRASEIRA
    ================================================== -->

    <path
        class="perna perna-traseira"
        d="
            M75 96
            C68 106, 59 116, 48 124
            C42 129, 36 132, 30 134
        "
    />


    <!-- =================================================
         PERNA DIANTEIRA
    ================================================== -->

    <path
        class="perna perna-dianteira"
        d="
            M83 96
            C91 106, 101 113, 113 118
            C120 121, 126 122, 133 121
        "
    />

</svg>

        <div class="fada-pergaminho">
            <span></span>
        </div>

    </div>

    <div class="po-fada"></div>
</div>
        
        <button
            class="estado-voltar"
            data-voltar="pais"
            aria-label="Voltar"
        >
            ←
        </button>


        <article class="carta">

            <header class="carta-cabecalho">

                <div
                    id="cartaPais"
                    class="carta-pais"
                >
                    BRASIL
                </div>

                <div
                    id="cartaNome"
                    class="carta-nome"
                >
                    —
                </div>

            </header>


            <div class="carta-divisor">
                <span>✦</span>
            </div>


            <div
                id="cartaTexto"
                class="carta-texto"
            ></div>


            <div class="carta-final">
                ♡
            </div>

        </article>


        <nav class="mensagem-controles">

            <button
                id="mensagemAnterior"
                type="button"
                data-i18n="anterior"
            >
                Anterior
            </button>


            <span id="mensagemContador">
                1 de 1
            </span>


            <button
                id="mensagemProxima"
                type="button"
                data-i18n="proxima"
            >
                Próxima
            </button>

        </nav>

    </section>



    <!-- =====================================================
         CARREGAMENTO
    ====================================================== -->

    <div
        id="carregando"
        class="carregando"
    >
        <span>✦</span>
    </div>


    <!-- =====================================================
         ERRO
    ====================================================== -->

    <div
        id="erro"
        class="erro"
        hidden
    >

        <p data-i18n="erro">
            Não foi possível carregar as mensagens.
        </p>

        <button
            id="tentarNovamente"
            type="button"
            data-i18n="tentarNovamente"
        >
            Tentar novamente
        </button>

    </div>


</main>


<!-- =========================================================
     GLOBE.GL
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>


<!-- =========================================================
     JAVASCRIPT DO MURAL
========================================================= -->

<script src="mensagem.js"></script>


</body>
</html>
