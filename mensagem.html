<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>D.MARCO — Mensagens</title>

    <link
        rel="stylesheet"
        href="mensagem.css"
    >

</head>


<body>

<main class="mensagens-page">


    <!-- =====================================================
         TOPO
    ====================================================== -->

    <header class="mensagens-topo">

        <a
            href="index.html"
            class="mensagens-voltar"
            aria-label="Voltar"
        >
            ←
        </a>


        <div class="mensagens-titulo">

            <span data-i18n="tituloMural">MURAL</span>

            <i></i>

            <small data-i18n="subtitulo">
                Mensagens ao redor do mundo
            </small>
            
            
        </div>


        <button
            class="mensagens-musica"
            type="button"
            aria-label="Música"
        >
            ♫
        </button>

    </header>



    <!-- =====================================================
         MURAL / GLOBO
    ====================================================== -->

    <section
        class="estado estado-mural ativo"
        data-estado="mural"
    >

        <div
            id="globo"
            class="globo"
            aria-label="Globo interativo"
        ></div>
        
<p
        class="globo-instrucao"
        data-i18n="instrucaoGlobo"
    >
        Mova o globo para explorar os países.<br>
        Toque nas luzes para ver as mensagens.
    </p>

        
    </section>



    <!-- =====================================================
         LISTA DE PAÍSES
    ====================================================== -->

    <section
        class="estado estado-paises"
        data-estado="paises"
    >

        <div class="lista-cabecalho">

            <h1>MURAL</h1>

            <i>✦</i>

            <p data-i18n="subtitulo">
                Mensagens ao redor do mundo
            </p>

        </div>


        <div
            id="listaPaises"
            class="lista-paises"
        ></div>


        <p
            class="lista-instrucao"
            data-i18n="instrucaoPais"
        >
            Toque em um país para ver<br>
            as mensagens ♡
        </p>

    </section>



    <!-- =====================================================
         APRESENTAÇÃO DO PAÍS
    ====================================================== -->

   <section
    class="estado estado-pais"
    data-estado="pais"
>

    <button
        class="estado-voltar"
        data-voltar="mural"
        aria-label="Voltar ao globo"
    >
        ←
    </button>


    <article class="mensagens-carta">

        <header class="mensagens-carta-cabecalho">

            <h1 id="paisNome">
                BRASIL
            </h1>

            <div class="mensagens-carta-divisor">
                <span>✦</span>
            </div>

            <p data-i18n="listaMensagensTitulo">
                Mensagens para você
            </p>

        </header>


        <div
            id="listaMensagens"
            class="lista-mensagens"
        ></div>

    </article>

</section>


    <!-- =====================================================
         CARTA / MENSAGEM
    ====================================================== -->

    <section
        class="estado estado-mensagem"
        data-estado="mensagem"
    >

  <div
    class="fada-carregando"
    aria-hidden="true"
>
    <div class="rastro-fada"></div>

    <div class="fada">

       <svg
    class="fada-silhueta"
    viewBox="0 0 140 180"
    aria-hidden="true"
>

    <!-- ASAS -->

    <path
        class="asa asa-esquerda"
        d="
            M58 57
            C43 35, 22 24, 9 30
            C24 34, 31 44, 28 56
            C25 67, 34 76, 48 73
            C55 71, 60 65, 63 60
            Z
        "
    />

    <path
        class="asa asa-direita"
        d="
            M68 57
            C82 31, 105 18, 124 26
            C110 31, 105 41, 111 50
            C117 60, 110 70, 96 73
            C84 76, 74 68, 68 61
            Z
        "
    />


    <!-- CABELO / CONTORNO -->

    <path
        class="cabelo"
        d="
            M55 29
            C47 31, 44 38, 47 45
            C48 50, 46 56, 41 61
            C49 59, 55 55, 58 49
            C61 55, 66 59, 72 60
            C67 54, 66 48, 68 43
            C71 35, 65 29, 58 28
            Z
        "
    />


    <!-- CABEÇA -->

    <circle
        class="cabeca"
        cx="59"
        cy="35"
        r="8"
    />


    <!-- CORPO -->

    <path
        class="corpo"
        d="
            M55 45
            C50 52, 50 64, 54 75
            C57 83, 54 91, 49 101
            C46 108, 41 115, 34 122

            C44 118, 54 111, 60 101

            C65 111, 74 119, 85 123
            C78 115, 72 106, 69 98
            C66 90, 66 82, 69 74

            C73 63, 70 51, 64 45
            Z
        "
    />


    <!-- BRAÇO QUE SEGURA O PERGAMINHO -->

    <path
        class="braco"
        d="
            M64 57
            C72 62, 79 64, 87 58
            C91 55, 94 52, 98 49
        "
    />

    <circle
        class="mao"
        cx="99"
        cy="48"
        r="2.4"
    />


    <!-- OUTRO BRAÇO -->

    <path
        class="braco"
        d="
            M53 57
            C46 62, 42 68, 39 75
        "
    />


    <!-- PERNA TRASEIRA -->

    <path
        class="perna"
        d="
            M57 92
            C52 105, 45 118, 35 130
            C31 135, 27 139, 23 142
        "
    />


    <!-- PERNA DIANTEIRA -->

    <path
        class="perna"
        d="
            M64 91
            C69 104, 76 115, 87 124
            C92 128, 96 131, 101 133
        "
    />

</svg>

        <div class="fada-pergaminho">
            <span></span>
        </div>

    </div>

    <div class="po-fada"></div>
</div>
        
        <button
            class="estado-voltar"
            data-voltar="pais"
            aria-label="Voltar"
        >
            ←
        </button>


        <article class="carta">

            <header class="carta-cabecalho">

                <div
                    id="cartaPais"
                    class="carta-pais"
                >
                    BRASIL
                </div>

                <div
                    id="cartaNome"
                    class="carta-nome"
                >
                    —
                </div>

            </header>


            <div class="carta-divisor">
                <span>✦</span>
            </div>


            <div
                id="cartaTexto"
                class="carta-texto"
            ></div>


            <div class="carta-final">
                ♡
            </div>

        </article>


        <nav class="mensagem-controles">

            <button
                id="mensagemAnterior"
                type="button"
                data-i18n="anterior"
            >
                Anterior
            </button>


            <span id="mensagemContador">
                1 de 1
            </span>


            <button
                id="mensagemProxima"
                type="button"
                data-i18n="proxima"
            >
                Próxima
            </button>

        </nav>

    </section>



    <!-- =====================================================
         CARREGAMENTO
    ====================================================== -->

    <div
        id="carregando"
        class="carregando"
    >
        <span>✦</span>
    </div>


    <!-- =====================================================
         ERRO
    ====================================================== -->

    <div
        id="erro"
        class="erro"
        hidden
    >

        <p data-i18n="erro">
            Não foi possível carregar as mensagens.
        </p>

        <button
            id="tentarNovamente"
            type="button"
            data-i18n="tentarNovamente"
        >
            Tentar novamente
        </button>

    </div>


</main>


<!-- =========================================================
     GLOBE.GL
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>


<!-- =========================================================
     JAVASCRIPT DO MURAL
========================================================= -->

<script src="mensagem.js"></script>


</body>
</html>
